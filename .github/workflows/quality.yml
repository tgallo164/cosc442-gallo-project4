name: CoffeeMaker Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

    
      - name: Grand execution permission for mvnw
        working-directory: CoffeeMaker    
        run: chmod +x mvnw

      - name: Run JUnit regression tests
        working-directory: CoffeeMaker 
        run: ./mvnw test

      # Add PIT mutation testing later
      - name: Run PIT mutation testing
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage    
      # Add PIT report artifact upload later